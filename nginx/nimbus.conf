# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    server_name docs.nimbus-public.local;

    # Redirige todo el tráfico del puerto 80 al 443 de forma permanente
    return 301 https://$host$request_uri;
}

# 2. Bloque principal seguro (HTTPS)
server {
    listen 443 ssl;
    server_name docs.nimbus-public.local;

    # Certificados que acabamos de crear
    ssl_certificate /etc/nginx/certs/nimbus.crt;
    ssl_certificate_key /etc/nginx/certs/nimbus.key;

    # Restricción de protocolos (solo versiones seguras)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Envío del tráfico a Apache
    location / {
        proxy_pass http://apache:8080;
        proxy_set_header Host $host; # <--- LA LÍNEA QUE FALTABA
    }
}