# Le decimos a Apache que escuche en nuestro puerto interno personalizado
Listen 8080

# 1. COMPORTAMIENTO POR DEFECTO (Atrapa dominios desconocidos)
<VirtualHost *:8080>
    ServerName default
    DocumentRoot /var/www/html
    
    # Bloqueamos el acceso a cualquier dominio que no sea los nuestros
    <Directory /var/www/html>
        Require all denied
    </Directory>
    
    ErrorLog ${APACHE_LOG_DIR}/default_error.log
    CustomLog ${APACHE_LOG_DIR}/default_access.log combined
</VirtualHost>

# 2. MARCA PÚBLICA
<VirtualHost *:8080>
    ServerName docs.nimbus-public.local
    DocumentRoot /var/www/html/publico
    
    <Directory /var/www/html/publico>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/publico_error.log
    CustomLog ${APACHE_LOG_DIR}/publico_access.log combined
</VirtualHost>

# 3. MARCA INTERNA (Protegida)
<VirtualHost *:8080>
    ServerName admin.nimbus-internal.local
    DocumentRoot /var/www/html/interno
    
    <Directory /var/www/html/interno>
        # Desactiva el listado de directorios
        Options -Indexes
        Require all granted
    </Directory>

    # Protege específicamente nuestro archivo sensible
    <Files "db-passwords.ini">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/interno_error.log
    CustomLog ${APACHE_LOG_DIR}/interno_access.log combined
</VirtualHost>