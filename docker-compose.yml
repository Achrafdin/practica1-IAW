networks:
  red_nimbus:
    driver: bridge

services:
  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimbus_apache
    volumes:
      - ./html:/var/www/html
      - ./apache:/etc/apache2/sites-available
    command: sleep infinity
    networks:
      - red_nimbus

  cliente:
    image: ubuntu:22.04
    container_name: nimbus_cliente
    command: sleep infinity
    networks:
      - red_nimbus

  nginx:
    image: nginx:latest
    container_name: nimbus_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./certs:/etc/nginx/certs
    command: sleep infinity
    networks:
      - red_nimbus