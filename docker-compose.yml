version: '3.8'


networks:
  red_nimbus:
    driver: bridge

services:

  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nimbus_apache
    ports:
      - "8080:8080"
    volumes:
      - ./html:/var/www/html
      - ./apache:/etc/apache2/sites-available
    
    command: sleep infinity
    networks:
      - red_nimbus

  
  cliente:
    image: ubuntu:22.04
    container_name: nimbus_cliente
    command: sleep infinity
    networks:
      - red_nimbus